name: refresh-assets

# 每日抓一次“官方 CLI 到底发了什么”，与 assets/ 做 canonical diff。
#
# 四态（docs/asset-format.md §5，禁止静默）：
#   NO_CAPTURE   -> exit 1 + gh issue create（label no-capture）
#   EXTRACT_FAIL -> exit 1 + gh issue create（label extract-fail）
#   DRIFT        -> 开 PR（label asset-drift）
#   NO_DRIFT     -> 打印 NO_DRIFT，exit 0
#
# 全程不接触上游：CLI 的 baseURL 指向本机 tools/sink.py，零额度、不会被 429。
#
# 脱敏（docs/asset-format.md §6 四层）：
#   1 采集层 sink.py 负责；2 提取层 extract_assets.py 负责（本文件不二次加工）
#   3 提交前：对 candidate 与 assets/ 全文扫描 Bearer / ses_ / ghp_ / sk- / [0-9a-f]{24}，命中即 fail
#   4 artifact：只上传 _cap/candidate，原始 captures（_cap/bodies）绝不上传

on:
  workflow_dispatch:
    inputs:
      egress:
        description: "抓包与验收所用出口：direct / warp / vpngate"
        required: false
        type: choice
        options:
          - direct
          - warp
          - vpngate
        default: "direct"
      verify_e2e:
        description: "抓到后是否派发 zen-direct-v2 的 asset-e2e 并回帖结果"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write        # push asset-drift/* 分支、提交 candidate
  pull-requests: write   # gh pr create
  issues: write          # NO_CAPTURE / EXTRACT_FAIL 时 gh issue create
  actions: write         # PR 建好后显式派发 ci.yml（GITHUB_TOKEN 推的分支不会自动触发）

# 防叠加：上一轮没跑完时新的等待（不 cancel，避免把正在推的 PR 打断）
concurrency:
  group: refresh-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 15 -> 25：新增的「形态探测」阶段自身有 SHAPE_BUDGET(540s) + 单形态 SHAPE_TIMEOUT(180s)
    # 的上界，叠加主抓包 240s 与出口验收 180s，15 分钟在最坏情况下会先撞 job timeout，
    # 那样连 artifact 和 step summary 都写不出来。这里只是给上界留余量，不改变任何步骤行为。
    timeout-minutes: 25
    env:
      W: ${{ github.workspace }}/_cap
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      EGRESS: ${{ github.event.inputs.egress || 'direct' }}
      VERIFY_E2E: ${{ github.event.inputs.verify_e2e || 'true' }}
      OPENCODE_DISABLE_AUTOUPDATE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # PR 上的 ci 会停在 action_required（GITHUB_TOKEN 推的分支触发的工作流需要人工
      # 批准），所以闸门必须在产出方就执行一遍：这里是唯一能让 PR 内容可信的地方。
      # ---------- 出口（egress）----------
      # 抓包本身是本地回环（CLI -> sink.py），出口 IP 不影响抓到什么；
      # 「这套定义从某个出口 IP 打上游会不会被接受」是另一件事，由 sink 之后的
      # 验收步骤在该出口上真打一次上游来回答。
      - name: "Egress direct: show public IP"
        if: env.EGRESS == 'direct'
        run: |
          echo "egress=direct"
          curl -s -m 20 https://api.ipify.org || true
          echo

      - name: Install WARP (egress=warp)
        if: env.EGRESS == 'warp'
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/share/keyrings
          curl -fsSL --retry 3 --retry-delay 1 https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(. /etc/os-release && echo $VERSION_CODENAME) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get -o Acquire::Retries=3 update -y
          sudo apt-get -o Acquire::Retries=3 install -y cloudflare-warp
          sudo systemctl enable warp-svc >/dev/null 2>&1 || true
          sudo systemctl start warp-svc >/dev/null 2>&1 || sudo service warp-svc start >/dev/null 2>&1 || true
          for i in $(seq 1 30); do sudo systemctl is-active --quiet warp-svc && break; sleep 1; done
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode warp+doh
          sudo warp-cli --accept-tos connect
          sleep 3
          sudo warp-cli --accept-tos status || true
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf >/dev/null
          echo "egress IP: $(curl -s -m 25 https://api.ipify.org || echo unknown)"

      - name: Setup vpngate egress (egress=vpngate)
        if: env.EGRESS == 'vpngate'
        run: |
          set -euo pipefail
          mkdir -p "$W/vp"
          cd "$W/vp"
          curl -fsSL --retry 3 -o nodes.csv "https://www.vpngate.net/api/iphone/"
          echo "nodes.csv 行数=$(wc -l < nodes.csv)"
          sb_tag=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          sb_ver=${sb_tag#v}
          curl -fsSL --retry 3 -o sb.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${sb_tag}/sing-box-${sb_ver}-linux-amd64.tar.gz"
          tar -xzf sb.tar.gz
          install -m 0755 "sing-box-${sb_ver}-linux-amd64/sing-box" ./sing-box
          ./sing-box version | head -2
          curl -fsSL --retry 3 -o vpngate_to_singbox.py \
            "https://raw.githubusercontent.com/2061969365/zen-vpngate-cloud-test/main/scripts/vpngate_to_singbox.py"
          # 脚本按 cwd 找 nodes.csv/sing-box，所以这里 cat 之前必须还在 $W/vp
          python3 "$GITHUB_WORKSPACE/tools/vpngate_pick.py"
          cat "$W/vp/proxy.env" >> "$GITHUB_ENV"
          echo "vpngate 出口就绪"

      - name: Self-check (unit tests + current assets)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 tools/validate_assets.py --assets assets --strict --tools-only

      - name: Install @opencode/cli@latest and record version
        run: |
          set -euo pipefail
          export NPM_CONFIG_PREFIX="$HOME/.npm-global"
          export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
          npm install -g @opencode/cli@latest 2>&1 | tail -5
          echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
          CLI_VER="$(opencode --version 2>&1 | tail -1 | tr -d '\r')"
          if [ -z "$CLI_VER" ]; then
            echo "opencode --version 输出为空"
            exit 1
          fi
          echo "CLI_VER=$CLI_VER" >> "$GITHUB_ENV"
          echo "CLI version: $CLI_VER"

      - name: Start local capture sink and wait for the port
        run: |
          set -euo pipefail
          mkdir -p "$W/bodies" "$W/candidate"
          python3 tools/sink.py --port 19100 --out "$W/bodies" >"$W/sink.log" 2>&1 &
          echo "SINK_PID=$!" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import socket
          import sys
          import time

          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", 19100), timeout=1.0):
                      print("sink ready on 127.0.0.1:19100")
                      sys.exit(0)
              except OSError:
                  time.sleep(0.2)
          print("sink not ready after 30s")
          sys.exit(1)
          PY
          cat "$W/sink.log"

      - name: Capture one real CLI request (baseURL -> sink)
        # baseURL 注入方式与 zen-direct-v2/.github/workflows/capture-cli-vs-gateway.yml 一致：
        # CLI 照常构造请求（工具定义 + system prompt），只是发到 127.0.0.1。
        # CLI 自身退出码不作为判据（sink 已拿到 body 也有价值），由 extract 决定四态。
        run: |
          set -euo pipefail
          set +e
          OPENCODE_CONFIG_CONTENT='{"provider":{"opencode":{"options":{"baseURL":"http://127.0.0.1:19100/inference/v1"}}}}' \
            timeout --signal=TERM --kill-after=15 240 \
              opencode run -m opencode/deepseek-v4.1-flash-free "Reply with the single word: ok" \
              >"$W/cli.out" 2>"$W/cli.err"
          CLI_EXIT=$?
          set -e
          BODY_COUNT="$(find "$W/bodies" -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          {
            echo "CLI_EXIT=$CLI_EXIT"
            echo "BODY_COUNT=$BODY_COUNT"
          } >> "$GITHUB_ENV"
          echo "cli_exit=$CLI_EXIT captured_requests=$BODY_COUNT"
          tail -3 "$W/cli.out" || true
          tail -12 "$W/cli.err" || true

      # 抓包只证明「CLI 发了什么」；这里证明「从当前出口 IP 打上游，这套东西能不能被接受」。
      # 不经 sink，直接打真实上游，所以会消耗免费额度——一次一问。
      - name: Egress acceptance check (real upstream, no sink)
        continue-on-error: true
        run: |
          set -uo pipefail
          set +e
          START=$(date +%s)
          timeout --signal=TERM --kill-after=15 180 \
            opencode run -m opencode/deepseek-v4.1-flash-free "Reply with the single word: ok" \
            >"$W/acc.out" 2>"$W/acc.err"
          ACC_EXIT=$?
          ACC_SEC=$(( $(date +%s) - START ))
          set -e
          ACC_IP="$(curl -s -m 20 https://api.ipify.org || echo unknown)"
          {
            echo "ACC_EXIT=$ACC_EXIT"
            echo "ACC_SEC=$ACC_SEC"
            echo "ACC_IP=$ACC_IP"
          } >> "$GITHUB_ENV"
          echo "egress=$EGRESS ip=$ACC_IP exit=$ACC_EXIT 耗时=${ACC_SEC}s"
          tail -5 "$W/acc.out" || true
          tail -20 "$W/acc.err" || true
          {
            echo ""
            echo "### 出口验收（真实上游）"
            echo "- egress: \`$EGRESS\`"
            echo "- 出口 IP: \`$ACC_IP\`"
            echo "- exit: \`$ACC_EXIT\`（0 = 上游接受）"
            echo "- 耗时: ${ACC_SEC}s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Extract candidate assets
        # 分类依据优先取 extract_assets.py 自己的 --report-json 里的 status
        # （EXIT_OK=0 / EXIT_FAIL=1，两种失败共用 1，故不能只看退出码）。
        # 没有 report（例如脚本缺失、argparse 用法错误）时才退回启发式：
        #   原始请求 0 条 -> NO_CAPTURE，有请求 -> EXTRACT_FAIL。
        run: |
          set -euo pipefail
          mkdir -p "$W/candidate"
          set +e
          python3 tools/extract_assets.py \
            --captures "$W/bodies" \
            --out "$W/candidate" \
            --cli-version "$CLI_VER" \
            --report-json "$W/extract-report.json" \
            >"$W/extract.out" 2>&1
          EXTRACT_EXIT=$?
          set -e
          CANDIDATE_OK=0
          if [ -s "$W/candidate/official_tools.json" ] && [ -s "$W/candidate/prompt.txt" ]; then
            CANDIDATE_OK=1
          fi
          REPORT_STATUS="none"
          if [ -f "$W/extract-report.json" ]; then
            REPORT_STATUS="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1],encoding="utf-8")).get("status") or "none")' "$W/extract-report.json" 2>/dev/null || echo none)"
          fi
          STATE=EXTRACT_FAIL
          if [ "$EXTRACT_EXIT" -eq 0 ] && [ "$CANDIDATE_OK" -eq 1 ]; then
            STATE=PENDING
          elif [ "$REPORT_STATUS" = "NO_CAPTURE" ]; then
            STATE=NO_CAPTURE
          elif [ "${BODY_COUNT:-0}" -eq 0 ]; then
            # 抓包目录里一条请求都没有 -> 确属没抓到
            STATE=NO_CAPTURE
          fi
          {
            echo "EXTRACT_EXIT=$EXTRACT_EXIT"
            echo "CANDIDATE_OK=$CANDIDATE_OK"
            echo "REPORT_STATUS=$REPORT_STATUS"
            echo "STATE=$STATE"
          } >> "$GITHUB_ENV"
          echo "extract_exit=$EXTRACT_EXIT candidate_ok=$CANDIDATE_OK report_status=$REPORT_STATUS state=$STATE"
          tail -40 "$W/extract.out" || true

      # ---------- 抓包多样化（只采元数据，绝不采集/上传 body）----------
      # 主抓包只有一种形态（一句 "Reply with the single word: ok"），所以它只能回答
      # 「这一个形态下 CLI 发什么」。工具集会不会随任务/agent 形态变化，必须换几种
      # 形态各抓一次才知道。
      # 隔离：独立 sink（端口 19101，输出 $W/shapes/bodies）。主 sink 的 $W/bodies 是
      # extract 的输入，往里多塞请求就会改掉候选选择，所以这里绝不复用同一个 sink。
      # 容错：这是探测步骤，任何一个形态失败都只记一行 skipped/failed，
      # 内部兜底 + continue-on-error 双保险，绝不让 refresh 流程失败。
      - name: "Probe request shapes on an isolated sink (metadata only)"
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          SHAPES="$W/shapes"
          SHAPES_PORT=19101
          SHAPE_TIMEOUT="${SHAPE_TIMEOUT:-180}"
          SHAPE_BUDGET="${SHAPE_BUDGET:-540}"
          SHAPES_CFG='{"provider":{"opencode":{"options":{"baseURL":"http://127.0.0.1:19101/inference/v1"}}}}'
          mkdir -p "$SHAPES/bodies" "$SHAPES/results"
          T0=$(date +%s)

          # 兜底 1：先把 matrix.json 写成「全部未执行」。即使本步骤被中途掐断（job timeout /
          # cancel / python 崩），artifact 里也有一个结构完整的 matrix.json。
          python3 - "$SHAPES/matrix.json" <<'PY'
          import json
          import sys

          names = ["baseline_exact", "task_read_file", "agent_plan"]
          payload = {
              "workflow": "refresh-assets",
              "stage": "shapes",
              "baseline": "baseline_exact",
              "baseline_names_sha": None,
              "note": "只有元数据（名字/数量/sha），不含任何 prompt 正文",
              "shapes": [
                  {
                      "shape": name,
                      "status": "skipped",
                      "reason": "未执行（步骤提前结束或被跳过）",
                      "exit": None,
                      "bodies": 0,
                      "bodies_with_tools": 0,
                      "tools": 0,
                      "names_sha": None,
                      "names": [],
                  }
                  for name in names
              ],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          print("matrix.json 兜底骨架 ->", sys.argv[1])
          PY

          # 独立 sink
          SHAPES_SINK_PID=""
          python3 tools/sink.py --port "$SHAPES_PORT" --out "$SHAPES/bodies" \
            >"$SHAPES/sink.log" 2>&1 &
          SHAPES_SINK_PID=$!
          trap 'if [ -n "${SHAPES_SINK_PID:-}" ]; then kill "$SHAPES_SINK_PID" 2>/dev/null || true; fi' EXIT
          python3 - "$SHAPES_PORT" <<'PY'
          import socket
          import sys
          import time

          port = int(sys.argv[1])
          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  with socket.create_connection(("127.0.0.1", port), timeout=1.0):
                      print("shapes sink ready on 127.0.0.1:{0}".format(port))
                      sys.exit(0)
              except OSError:
                  time.sleep(0.2)
          exit(1)
          PY
          if [ $? -ne 0 ]; then
            echo "::warning::shapes sink 起不来（端口 $SHAPES_PORT），全部形态记 skipped；主流程不受影响"
            cat "$SHAPES/sink.log" 2>/dev/null || true
            SINK_OK=0
          else
            SINK_OK=1
          fi

          # 先探测 CLI 支持哪些形态参数，探测不到就跳过对应形态并记 skipped
          HAS_AGENT=0
          HAS_AGENT_PLAN=0
          opencode --help >"$SHAPES/help.txt" 2>&1 || true
          opencode run --help >"$SHAPES/run-help.txt" 2>&1 || true
          if grep -qF -e '--agent' "$SHAPES/run-help.txt" 2>/dev/null; then HAS_AGENT=1; fi
          if [ "$HAS_AGENT" = "1" ] && grep -qi 'plan' "$SHAPES/run-help.txt" 2>/dev/null; then HAS_AGENT_PLAN=1; fi
          echo "probe: --agent=$HAS_AGENT agent_plan=$HAS_AGENT_PLAN"

          budget_left() {
            [ $(( $(date +%s) - T0 )) -lt "$SHAPE_BUDGET" ]
          }

          record_skip() {
            python3 - "$SHAPES/results" "$1" "$2" <<'PY'
          import json
          import os
          import sys

          out_dir, name, reason = sys.argv[1], sys.argv[2], sys.argv[3]
          payload = {
              "shape": name,
              "status": "skipped",
              "reason": reason,
              "exit": None,
              "bodies": 0,
              "bodies_with_tools": 0,
              "tools": 0,
              "names_sha": None,
              "names": [],
          }
          with open(os.path.join(out_dir, name + ".json"), "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          print("shape={0} skipped: {1}".format(name, reason))
          PY
          }

          run_shape() {
            name="$1"
            shift
            start_ts="$(python3 -c 'import time; print(repr(time.time()))')"
            # 形态内部再兜一层：sink 只回一个最小 SSE，CLI 的退出码不作为判据
            OPENCODE_CONFIG_CONTENT="$SHAPES_CFG" \
              timeout --signal=TERM --kill-after=15 "$SHAPE_TIMEOUT" \
                opencode run -m opencode/deepseek-v4.1-flash-free "$@" \
                >"$SHAPES/$name.out" 2>"$SHAPES/$name.err"
            exit_code=$?
            echo "shape=$name exit=$exit_code"
            tail -3 "$SHAPES/$name.err" 2>/dev/null || true
            python3 - "$SHAPES/bodies" "$start_ts" "$SHAPES/results/$name.json" "$name" "$exit_code" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          bodies_dir, start_ts, out_path, name, exit_code = sys.argv[1:6]
          start = float(start_ts)
          bodies = 0
          with_tools = 0
          best = 0
          names = []
          # 只认本形态产生的记录：sink 每条都写 ts，按时间切分，不会串到别的形态
          for path in sorted(pathlib.Path(bodies_dir).glob("*.json")):
              try:
                  record = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if float(record.get("ts") or 0) < start:
                  continue
              bodies += 1
              body = record.get("body")
              if isinstance(body, str):
                  try:
                      body = json.loads(body)
                  except Exception:
                      body = None
              if not isinstance(body, dict):
                  continue
              tools = body.get("tools")
              if not isinstance(tools, list):
                  continue
              with_tools += 1
              if len(tools) > best:
                  best = len(tools)
                  names = []
                  for entry in tools:
                      inner = entry.get("function") if isinstance(entry, dict) else None
                      source = inner if isinstance(inner, dict) else entry
                      tool_name = source.get("name") if isinstance(source, dict) else None
                      if isinstance(tool_name, str) and tool_name.strip():
                          names.append(tool_name.strip())
          unique = sorted(set(names))
          payload = {
              "shape": name,
              # 抓到 0 条就老实写 empty：matrix 里一眼能看出「这条形态没采到东西」，
              # 不会被当成「采到了但工具集是空的」。
              "status": "captured" if bodies else "empty",
              "reason": "" if bodies else "sink 没收到请求（CLI exit={0}）".format(exit_code),
              "exit": int(exit_code),
              "bodies": bodies,
              "bodies_with_tools": with_tools,
              "tools": best,
              "names_sha": hashlib.sha256("\n".join(unique).encode("utf-8")).hexdigest() if unique else None,
              "names": unique,
          }
          pathlib.Path(out_path).write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print("shape={0} bodies={1} tools={2} names_sha={3}".format(
              name, bodies, best, payload["names_sha"]))
          PY
          }

          if [ "$SINK_OK" = "1" ]; then
            # 形态 1：与主抓包同一句 prompt（基线，应当与主抓包一致）
            if budget_left; then
              run_shape baseline_exact "Reply with the single word: ok"
            else
              record_skip baseline_exact "形态预算用尽（SHAPE_BUDGET=$SHAPE_BUDGET）"
            fi

            # 形态 2：长得完全不同的任务（要求列目录 + 读文件），看工具集是否随任务变化
            if budget_left; then
              run_shape task_read_file "Run ls -la to list the current directory, read README.md, then summarize this repository in three sentences."
            else
              record_skip task_read_file "形态预算用尽（SHAPE_BUDGET=$SHAPE_BUDGET）"
            fi

            # 形态 3：agent/plan 形态；CLI 不支持就明确记 skipped，不假装跑过
            if [ "$HAS_AGENT" != "1" ]; then
              record_skip agent_plan "opencode run --help 未提供 --agent"
            elif [ "$HAS_AGENT_PLAN" != "1" ]; then
              record_skip agent_plan "有 --agent 但帮助里没有 plan 形态"
            elif ! budget_left; then
              record_skip agent_plan "形态预算用尽（SHAPE_BUDGET=$SHAPE_BUDGET）"
            else
              run_shape agent_plan --agent plan "Plan how you would rename a function in tools/sink.py. Do not edit any file."
            fi
          else
            record_skip baseline_exact "shapes sink 未就绪（端口 $SHAPES_PORT）"
            record_skip task_read_file "shapes sink 未就绪（端口 $SHAPES_PORT）"
            record_skip agent_plan "shapes sink 未就绪（端口 $SHAPES_PORT）"
          fi

          if [ -n "$SHAPES_SINK_PID" ]; then
            kill "$SHAPES_SINK_PID" 2>/dev/null || true
            SHAPES_SINK_PID=""
          fi

          # 兜底 2：汇总。缺结果文件的一律按 skipped 补行，任何 shape 失败都不影响退出码。
          python3 - "$SHAPES" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          shapes_dir = pathlib.Path(sys.argv[1])
          summary_path = sys.argv[2]
          order = ["baseline_exact", "task_read_file", "agent_plan"]
          note = {
              "baseline_exact": "与主抓包同一句 prompt（应与主抓包一致）",
              "task_read_file": "换任务：列目录 + 读 README.md",
              "agent_plan": "agent/plan 形态（--agent plan）",
          }

          results = []
          for name in order:
              path = shapes_dir / "results" / (name + ".json")
              value = None
              if path.is_file():
                  try:
                      value = json.loads(path.read_text(encoding="utf-8"))
                  except Exception:
                      value = None
              if not isinstance(value, dict):
                  value = {
                      "shape": name,
                      "status": "skipped",
                      "reason": "没有产出结果（sink 未就绪或步骤提前结束）",
                      "exit": None,
                      "bodies": 0,
                      "bodies_with_tools": 0,
                      "tools": 0,
                      "names_sha": None,
                      "names": [],
                  }
              results.append(value)

          baseline_sha = None
          for item in results:
              if item.get("shape") == "baseline_exact" and item.get("names_sha"):
                  baseline_sha = item["names_sha"]
                  break

          shapes = []
          for item in results:
              sha = item.get("names_sha")
              if item.get("status") != "captured" or baseline_sha is None:
                  consistent = None
              elif item.get("shape") == "baseline_exact":
                  consistent = True
              else:
                  consistent = sha == baseline_sha
              shapes.append(
                  {
                      "shape": item.get("shape"),
                      "status": item.get("status"),
                      "reason": item.get("reason") or "",
                      "exit": item.get("exit"),
                      "bodies": item.get("bodies", 0),
                      "bodies_with_tools": item.get("bodies_with_tools", 0),
                      "tools": item.get("tools", 0),
                      "names_sha": sha,
                      "names": item.get("names") or [],
                      "consistent_with_baseline": consistent,
                  }
              )

          matrix = {
              "workflow": "refresh-assets",
              "stage": "shapes",
              "baseline": "baseline_exact",
              "baseline_names_sha": baseline_sha,
              "note": "只有元数据（名字/数量/sha），不含任何 prompt 正文",
              "shapes": shapes,
          }
          (shapes_dir / "matrix.json").write_text(
              json.dumps(matrix, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          def clean(value):
              return str(value).replace("|", "\\|").replace("\n", " ")

          lines = [
              "",
              "### 抓包形态矩阵（独立 sink `{0}`，仅元数据）".format(shapes_dir),
              "",
              "| shape | exit | bodies | tools | names_sha | 与基线一致 |",
              "|---|---|---|---|---|---|",
          ]
          details = []
          captured_any = False
          for item in shapes:
              if item["status"] == "empty":
                  lines.append(
                      "| `{0}` | {1} | 0 | 0 | — | empty: {2} |".format(
                          item["shape"], item["exit"], clean(item["reason"] or "没抓到 body")
                      )
                  )
                  continue
              if item["status"] != "captured":
                  lines.append(
                      "| `{0}` | — | — | — | — | skipped: {1} |".format(
                          item["shape"], clean(item["reason"] or item["status"])
                      )
                  )
                  continue
              captured_any = True
              if item["shape"] == "baseline_exact":
                  same = "基线"
              elif item["consistent_with_baseline"] is True:
                  same = "是"
              elif item["consistent_with_baseline"] is False:
                  same = "**否**"
              else:
                  same = "n/a"
              sha = item["names_sha"] or "n/a"
              lines.append(
                  "| `{0}` | {1} | {2} | {3} | `{4}` | {5} |".format(
                      item["shape"],
                      item["exit"],
                      item["bodies"],
                      item["tools"],
                      sha[:12],
                      same,
                  )
              )
              details.append(
                  "- `{0}`：{1}；工具名 {2} 个：{3}".format(
                      item["shape"],
                      note.get(item["shape"], ""),
                      len(item["names"]),
                      ", ".join("`{0}`".format(n) for n in item["names"]) or "—",
                  )
              )
          if not captured_any:
              lines.append("")
              lines.append(
                  "所有形态都没抓到 body：见上方日志与 `$W/shapes/sink.log`。"
                  "主抓包、提取、脱敏、PR 流程完全不受影响（本步骤 continue-on-error）。"
              )
          if details:
              lines.append("")
              lines.append("<details><summary>各形态工具名集合</summary>")
              lines.append("")
              lines.extend(details)
              lines.append("")
              lines.append("</details>")
          lines.append("")

          with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

          # 兜底 3：无论如何都以 0 退出（探测失败不是 refresh 失败）
          exit 0

      - name: Validate candidate assets
        if: env.STATE == 'PENDING'
        run: |
          set -euo pipefail
          set +e
          python3 tools/validate_assets.py --assets "$W/candidate" >"$W/validate.out" 2>&1
          VALIDATE_EXIT=$?
          set -e
          echo "VALIDATE_EXIT=$VALIDATE_EXIT" >> "$GITHUB_ENV"
          tail -40 "$W/validate.out" || true
          if [ "$VALIDATE_EXIT" -ne 0 ]; then
            {
              echo "STATE=EXTRACT_FAIL"
              echo "FAIL_REASON=候选有内容但 validate_assets.py 自检不过 (exit=$VALIDATE_EXIT)"
            } >> "$GITHUB_ENV"
            echo "candidate 自检不过：exit=$VALIDATE_EXIT"
          fi

      - name: Redaction gate on candidate (Bearer / ses_ / ghp_ / sk- / 24-hex)
        # 第 3 层脱敏。命中即失败：candidate 目录直接清空，避免脏内容被 artifact 带出去。
        if: env.STATE == 'PENDING'
        run: |
          set -euo pipefail
          REDACT_EXIT=0
          set +e
          python3 - "$W/candidate" >"$W/redact.out" 2>&1 <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          # 三个前缀都加"左边界 + 最小 token 长度"：
          # 裸写 sk- 会命中正常英文词（task-oriented / risk-control），每天都会误报。
          # 24-hex 加前后边界，避免 64 位 sha256 里的 24 位子串被误判成 project id。
          GUARD = r"(?<![A-Za-z0-9_])"
          PATTERNS = [
              ("Bearer ", re.compile(GUARD + r"Bearer ")),
              ("ses_", re.compile(GUARD + r"ses_[A-Za-z0-9]{8,}")),
              ("ghp_", re.compile(GUARD + r"ghp_[A-Za-z0-9]{16,}")),
              ("sk-", re.compile(GUARD + r"sk-[A-Za-z0-9_-]{10,}")),
              ("[0-9a-f]{24}", re.compile(r"(?<![0-9a-fA-F])[0-9a-f]{24}(?![0-9a-fA-F])")),
          ]

          hits = 0
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  for label, pattern in PATTERNS:
                      if pattern.search(line):
                          hits += 1
                          print(f"HIT {path}:{lineno} pattern={label}")

          if hits:
              print(f"redaction gate failed: {hits} hit(s)")
              sys.exit(1)
          print("redaction gate clean")
          PY
          REDACT_EXIT=$?
          set -e
          echo "REDACT_EXIT=$REDACT_EXIT" >> "$GITHUB_ENV"
          cat "$W/redact.out" || true
          if [ "$REDACT_EXIT" -ne 0 ]; then
            rm -rf "$W/candidate"
            mkdir -p "$W/candidate"
            {
              echo "STATE=EXTRACT_FAIL"
              echo "FAIL_REASON=脱敏命中：候选里出现 token 形态，已清空 candidate 且不上传"
            } >> "$GITHUB_ENV"
            echo "脱敏命中，candidate 已清空"
          fi

      - name: Canonical diff against assets/
        # 比较 json 的 canonical 形式（sort_keys + 紧凑分隔符）与 prompt 的 sha256。
        # 不用文本 diff：文本 diff 会把 captured_at / source.run_url / 末尾空白算成漂移。
        # 漂移判据只含 order + tools（description/parameters/strict）+ prompt 正文。
        if: env.STATE == 'PENDING'
        run: |
          set -euo pipefail
          W="$W" ASSETS_DIR="$GITHUB_WORKSPACE/assets" CAND_DIR="$W/candidate" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys

          W = pathlib.Path(os.environ["W"])
          cur_dir = pathlib.Path(os.environ["ASSETS_DIR"])
          cand_dir = pathlib.Path(os.environ["CAND_DIR"])
          run_url = os.environ.get("RUN_URL", "")


          def canon(obj):
              return json.dumps(obj, sort_keys=True, separators=(",", ":"), ensure_ascii=False)


          def sha(text):
              return hashlib.sha256(text.encode("utf-8")).hexdigest()


          def read_json(path):
              return json.loads(pathlib.Path(path).read_text(encoding="utf-8"))


          cur = read_json(cur_dir / "official_tools.json")
          cand = read_json(cand_dir / "official_tools.json")
          cand_prompt_raw = (cand_dir / "prompt.txt").read_text(encoding="utf-8")
          # prompt 的 canonical 形式与 extract_assets.py 一致：rstrip + 单个换行
          # （这样 PR 里的 prompt 字节数/ sha 与 --report-json 的 prompt_bytes 对得上）
          cand_prompt = cand_prompt_raw.rstrip() + "\n"
          # 契约 §8：public runner 仓库不存 prompt 全文，当前值只能从 prompt-meta.json
          # 取摘要。所以 prompt 的比较是「候选 sha vs 摘要 sha」，不涉及正文。
          meta_path = cur_dir / "prompt-meta.json"
          cur_meta = read_json(meta_path) if meta_path.is_file() else {}

          cur_tools = cur.get("tools") or {}
          cand_tools = cand.get("tools") or {}
          cur_order = cur.get("order") or []
          cand_order = cand.get("order") or []

          cur_core = {"order": cur_order, "tools": cur_tools}
          cand_core = {"order": cand_order, "tools": cand_tools}
          sha_cur = sha(canon(cur_core))
          sha_cand = sha(canon(cand_core))
          sha_cur_prompt = cur_meta.get("sha256") or "(unknown)"
          sha_cand_prompt = sha(cand_prompt)
          sha_cand_tools = sha(canon(cand_tools))

          added = [n for n in cand_order if n not in cur_tools]
          removed = [n for n in cur_order if n not in cand_tools]
          for name in cand_tools:
              if name not in cur_tools and name not in added:
                  added.append(name)
          for name in cur_tools:
              if name not in cand_tools and name not in removed:
                  removed.append(name)

          changed = []
          for name in [n for n in cand_order if n in cur_tools]:
              fields = []
              for field in ("description", "parameters", "strict"):
                  if canon(cur_tools[name].get(field)) != canon(cand_tools[name].get(field)):
                      fields.append(field)
              if fields:
                  changed.append((name, fields))

          common = set(cur_tools) & set(cand_tools)
          order_changed = [n for n in cur_order if n in common] != [n for n in cand_order if n in common]

          tool_count = len(cand_tools)
          cur_prompt_bytes = int(cur_meta.get("bytes") or 0)
          prompt_bytes = len(cand_prompt.encode("utf-8"))
          prompt_changed = (cur_meta.get("sha256") or "") != sha_cand_prompt
          # 契约 §3.5：prompt 只做告警，不参与 DRIFT 判定，也绝不自动替换。
          # 抓包场景（裸仓库、最小 prompt）与生产注入场景不同构：实测 2026-11-17
          # 干净 runner 抓到 8012 字节，而生产注入的是 94858 字节——直接替换等于
          # 把 87KB 的正文删掉，是把好资产改坏的典型路径。
          prompt_ratio = (prompt_bytes / cur_prompt_bytes) if cur_prompt_bytes else 0.0
          prompt_scenario_mismatch = prompt_ratio < 0.5 or prompt_ratio > 2.0
          drift = bool(added or removed or changed or order_changed)

          def fmt_names(names):
              return ", ".join(f"`{n}`" for n in names) if names else "—"

          diff_lines = []
          diff_lines.append(f"- 新增工具 ({len(added)}): {fmt_names(added)}")
          diff_lines.append(f"- 删除工具 ({len(removed)}): {fmt_names(removed)}")
          if changed:
              detail = ", ".join(f"`{n}`({', '.join(f)})" for n, f in changed)
              diff_lines.append(f"- 改动工具 ({len(changed)}): {detail}")
          else:
              diff_lines.append("- 改动工具 (0): —")
          diff_lines.append(f"- order 顺序变化: {'是' if order_changed else '否'}")
          diff_lines.append(
              f"- prompt: {'变化' if prompt_changed else '无变化'}"
              f"（{cur_prompt_bytes} -> {prompt_bytes} 字节）"
          )
          diff_summary = "\n".join(diff_lines)

          summary = "\n".join(
              [
                  "### refresh-assets canonical diff",
                  "",
                  f"- state: **{'DRIFT' if drift else 'NO_DRIFT'}**",
                  f"- CLI 版本: `{cur.get('cli_version')}` -> `{cand.get('cli_version')}`",
                  f"- 工具数: {len(cur_tools)} -> {tool_count}",
                  f"- prompt 字节数: {cur_prompt_bytes} -> {prompt_bytes}",
                  f"- official_tools.json canonical sha256 (order+tools): `{sha_cur}` -> `{sha_cand}`",
                  f"- prompt.txt sha256 (rstrip 后补单个 LF，与 prompt_bytes 同口径): `{sha_cur_prompt}` -> `{sha_cand_prompt}`",
                  "",
                  diff_summary,
                  "",
              ]
          )
          print(summary)

          pr_body = "\n".join(
              [
                  f"由 `refresh-assets` 自动生成，run: {run_url}",
                  "",
                  "## 变化",
                  "",
                  f"- CLI 版本: `{cur.get('cli_version')}` -> `{cand.get('cli_version')}`",
                  f"- 工具数: {len(cur_tools)} -> {tool_count}",
                  f"- prompt 字节数: {cur_prompt_bytes} -> {prompt_bytes}",
                  "",
                  "## canonical sha256",
                  "",
                  "| 对象 | 当前 assets/ | 本次 candidate |",
                  "|---|---|---|",
                  f"| `official_tools.json`（order+tools，canonical json） | `{sha_cur}` | `{sha_cand}` |",
                  f"| `prompt.txt`（rstrip 后补单个 LF 的 sha256） | `{sha_cur_prompt}` | `{sha_cand_prompt}` |",
                  f"| `source.sha256`（仅 tools 对象，契约字段） | — | `{sha_cand_tools}` |",
                  "",
                  "## 逐字段 diff 摘要",
                  "",
                  diff_summary,
                  "",
                  "## 检查",
                  "",
                  "- [x] `validate_assets.py` 通过",
                  "- [x] 脱敏门禁通过（Bearer / ses_ / ghp_ / sk- / 24-hex 全无命中）",
                  "- [x] 原始 captures 未上传 artifact，仅 `assets_candidate`（即 `_cap/candidate`）",
                  "",
                  "> 合并即改变网关 vendor 的上游特征，请先确认 diff 合理。",
                  "",
              ]
          )
          (W / "pr_body.md").write_text(pr_body, encoding="utf-8")
          (W / "diff_summary.md").write_text(diff_summary + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"STATE={'DRIFT' if drift else 'NO_DRIFT'}\n")
              handle.write(f"TOOL_COUNT={tool_count}\n")
              handle.write(f"PROMPT_BYTES={prompt_bytes}\n")
              handle.write(f"SHA_TOOLS={sha_cand}\n")
              handle.write(f"SHA_PROMPT={sha_cand_prompt}\n")
              handle.write(f"DRIFT_TOOLS={len(added)}+{len(removed)}+{len(changed)}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary + "\n")

          print(f"canonical sha256 (candidate) official_tools={sha_cand} prompt={sha_cand_prompt}")
          print("STATE=" + ("DRIFT" if drift else "NO_DRIFT"))
          PY

      # ---------- 语义 diff（依赖并行交付的 tools/schema_diff.py）----------
      # canonical diff 只回答「变了没」；这一条回答「哪个路径从什么变成什么」。
      # 接口按约定调用（脚本可能还没落盘，故先 test -f）：
      #   python tools/schema_diff.py --old <旧>/official_tools.json --new <新>/official_tools.json \
      #       --out <json> --markdown        # exit 0 无变化 / 1 有变化 / 2 出错（--markdown 时 stdout 人读版）
      # 缺失或出错一律降级成 ::warning::：这一步是增强信息，不许把整条 refresh 流程弄挂。
      - name: "Semantic diff via tools/schema_diff.py (warning-only)"
        if: env.STATE == 'DRIFT' || env.STATE == 'NO_DRIFT'
        run: |
          set -euo pipefail
          # 与上一步 canonical diff 的 cur_dir / cand_dir 是同一对目录，只是显式落成变量：
          #   cur_dir  = $GITHUB_WORKSPACE/assets（公开仓库里的权威副本）
          #   cand_dir = $W/candidate（本轮候选）
          CUR_DIR="$GITHUB_WORKSPACE/assets"
          CAND_DIR="$W/candidate"
          SCRIPT="tools/schema_diff.py"
          SD_JSON="$W/schema_diff.json"
          SD_MD="$W/schema_diff.md"
          SD_EXIT=""
          SD_STATUS="skipped"
          SD_REASON=""
          rm -f "$SD_JSON" "$SD_MD"
          if [ ! -f "$SCRIPT" ]; then
            SD_REASON="tools/schema_diff.py 尚未落盘（并行交付中），跳过语义 diff"
          elif [ ! -s "$CUR_DIR/official_tools.json" ] || [ ! -s "$CAND_DIR/official_tools.json" ]; then
            SD_REASON="official_tools.json 缺失或为空，跳过语义 diff"
          else
            echo "old=$CUR_DIR/official_tools.json"
            echo "new=$CAND_DIR/official_tools.json"
            set +e
            python3 "$SCRIPT" \
              --old "$CUR_DIR/official_tools.json" \
              --new "$CAND_DIR/official_tools.json" \
              --out "$SD_JSON" \
              --markdown \
              >"$SD_MD" 2>"$W/schema_diff.err"
            SD_EXIT=$?
            set -e
            case "$SD_EXIT" in
              0) SD_STATUS="unchanged" ;;
              1) SD_STATUS="changed" ;;
              2) SD_STATUS="error"; SD_REASON="schema_diff.py exit=2（脚本自报出错），按 warning 处理" ;;
              *) SD_STATUS="error"; SD_REASON="schema_diff.py exit=$SD_EXIT（非约定退出码），按 warning 处理" ;;
            esac
            echo "schema_diff exit=$SD_EXIT status=$SD_STATUS"
            tail -8 "$W/schema_diff.err" 2>/dev/null || true
          fi
          if [ -n "$SD_REASON" ]; then
            echo "::warning::$SD_REASON"
          fi
          # 出错时脚本可能留下半截 json：解析不过就丢掉，残缺文件绝不上传
          if [ "$SD_STATUS" = "error" ]; then
            if [ -f "$SD_JSON" ] && ! python3 -c 'import json,sys;json.load(open(sys.argv[1],encoding="utf-8"))' "$SD_JSON" 2>/dev/null; then
              rm -f "$SD_JSON"
            fi
            rm -f "$SD_MD"
          fi
          # summary：包在 <details> 里，避免十几行 diff 刷屏
          {
            echo ""
            echo "<details><summary>语义 diff（tools/schema_diff.py）: $SD_STATUS</summary>"
            echo ""
            if [ -s "$SD_MD" ]; then
              cat "$SD_MD"
            else
              echo "_无可展示内容：${SD_REASON}_"
            fi
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          # 有变化时把 markdown 追加进 PR body：让 PR 自己带「哪个路径从什么变成什么」
          if [ "$SD_STATUS" = "changed" ] && [ -s "$W/pr_body.md" ] && [ -s "$SD_MD" ]; then
            {
              echo ""
              echo "## 语义 diff（tools/schema_diff.py）"
              echo ""
              echo "<details><summary>逐路径变化（展开看）</summary>"
              echo ""
              cat "$SD_MD"
              echo ""
              echo "</details>"
              echo ""
            } >> "$W/pr_body.md"
            echo "PR body 已追加语义 diff（$SD_MD）"
          fi
          {
            echo "SCHEMA_DIFF_STATUS=$SD_STATUS"
            echo "SCHEMA_DIFF_EXIT=${SD_EXIT:-n/a}"
          } >> "$GITHUB_ENV"
          echo "schema_diff: status=$SD_STATUS exit=${SD_EXIT:-n/a}"

      - name: "NO_CAPTURE / EXTRACT_FAIL: open issue and fail the run"
        if: env.STATE == 'NO_CAPTURE' || env.STATE == 'EXTRACT_FAIL'
        run: |
          set -euo pipefail
          if [ "$STATE" = "NO_CAPTURE" ]; then
            LABEL="no-capture"
            TITLE="[no-capture] refresh-assets: CLI 没有产生可用候选请求 (run $GITHUB_RUN_ID)"
          else
            LABEL="extract-fail"
            TITLE="[extract-fail] refresh-assets: 抽取/校验/脱敏失败 (run $GITHUB_RUN_ID)"
          fi
          gh label create no-capture --color B60205 --description "CLI capture produced no usable candidate request" --force || true
          gh label create extract-fail --color D93F0B --description "extract_assets / validate_assets / redaction failed on a candidate" --force || true
          {
            echo "## refresh-assets: $STATE"
            echo
            echo "- run: $RUN_URL"
            echo "- state: \`$STATE\`"
            echo "- cli: \`${CLI_VER:-unknown}\`"
            echo "- captured requests: \`${BODY_COUNT:-0}\`"
            echo "- extract exit: \`${EXTRACT_EXIT:-n/a}\`, validate exit: \`${VALIDATE_EXIT:-n/a}\`, redaction exit: \`${REDACT_EXIT:-n/a}\`"
            echo "- reason: ${FAIL_REASON:-见下方日志}"
            echo
            echo "### cli.stderr（尾部）"
            echo '```'
            tail -25 "$W/cli.err" 2>/dev/null || true
            echo '```'
            echo
            echo "### extract_assets.py（尾部）"
            echo '```'
            tail -40 "$W/extract.out" 2>/dev/null || true
            echo '```'
            echo
            echo "### validate_assets.py（尾部）"
            echo '```'
            tail -30 "$W/validate.out" 2>/dev/null || true
            echo '```'
            echo
            echo "### redaction gate"
            echo '```'
            tail -20 "$W/redact.out" 2>/dev/null || true
            echo '```'
            echo
            echo "### sink.log（尾部）"
            echo '```'
            tail -20 "$W/sink.log" 2>/dev/null || true
            echo '```'
            echo
            echo "原始 captures 未上传 artifact（只上传 \`assets_candidate\`）。"
          } > "$W/issue_body.md"
          ISSUE_URL="$(gh issue create --title "$TITLE" --body-file "$W/issue_body.md" --label "$LABEL")"
          echo "ISSUE_URL=$ISSUE_URL" >> "$GITHUB_ENV"
          {
            echo "### refresh-assets: $STATE"
            echo
            echo "- run: $RUN_URL"
            echo "- issue: $ISSUE_URL"
            echo "- reason: ${FAIL_REASON:-见 issue}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$STATE: issue 已开：$ISSUE_URL"
          exit 1

      - name: "DRIFT: push asset-drift branch and open PR"
        if: env.STATE == 'DRIFT'
        run: |
          set -euo pipefail
          # 固定分支名：每天漂移复用同一个分支与同一个 PR，避免 PR 刷屏。
          # 每次 run 用 --force-with-lease 覆盖，PR 自动更新；run 链接写在 PR body 里。
          BRANCH="asset-drift/latest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          mkdir -p assets
          cp "$W/candidate/official_tools.json" assets/official_tools.json
          # 契约 §8（public runner）：本仓库不存 prompt 全文，只存 sha/字节数摘要。
          # 全文留在私有仓库 zen-assets；这里写入摘要，让「prompt 有没有变」在公开
          # 的 git 历史里可见，同时不泄漏内容。
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib

          candidate = pathlib.Path(os.environ["W"]) / "candidate" / "prompt.txt"
          blob = candidate.read_bytes()
          meta_path = pathlib.Path("assets/prompt-meta.json")
          previous = json.loads(meta_path.read_text(encoding="utf-8")) if meta_path.is_file() else {}
          meta = {
              "sha256": hashlib.sha256(blob).hexdigest(),
              "bytes": len(blob),
              "chars": len(blob.decode("utf-8")),
              "cli_version": os.environ.get("CLI_VER", previous.get("cli_version", "")),
              "captured_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "previous_sha256": previous.get("sha256"),
              "previous_bytes": previous.get("bytes"),
              "note": "public runner 只存摘要；prompt 全文不在任何仓库，权威副本是网关源码树 tools/opencode_prompt_v2.txt",
          }
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("prompt-meta: %s -> %s bytes" % (meta.get("previous_bytes"), meta["bytes"]))
          PY
          # 回填 source 溯源字段（extract 只知道 cli 版本，不知道 run 链接）
          python3 - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path("assets/official_tools.json")
          doc = json.loads(path.read_text(encoding="utf-8"))
          source = doc.get("source") or {}
          source["workflow"] = "refresh-assets"
          source["run_url"] = os.environ.get("RUN_URL") or None
          doc["source"] = source
          path.write_text(
              json.dumps(doc, ensure_ascii=False, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
          )
          print("source.run_url ->", source["run_url"])
          PY
          # 第 3 层脱敏：提交前对整个 assets/ 再扫一遍，命中即 fail
          python3 - "$GITHUB_WORKSPACE/assets" >"$W/redact_assets.out" 2>&1 <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          # 与 candidate 门禁同一套模式（左边界 + 最小 token 长度；24-hex 前后边界）
          GUARD = r"(?<![A-Za-z0-9_])"
          PATTERNS = [
              ("Bearer ", re.compile(GUARD + r"Bearer ")),
              ("ses_", re.compile(GUARD + r"ses_[A-Za-z0-9]{8,}")),
              ("ghp_", re.compile(GUARD + r"ghp_[A-Za-z0-9]{16,}")),
              ("sk-", re.compile(GUARD + r"sk-[A-Za-z0-9_-]{10,}")),
              ("[0-9a-f]{24}", re.compile(r"(?<![0-9a-fA-F])[0-9a-f]{24}(?![0-9a-fA-F])")),
          ]

          hits = 0
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for lineno, line in enumerate(text.splitlines(), 1):
                  for label, pattern in PATTERNS:
                      if pattern.search(line):
                          hits += 1
                          print(f"HIT {path}:{lineno} pattern={label}")
          print("redaction gate on assets/: " + ("FAILED" if hits else "clean"))
          sys.exit(1 if hits else 0)
          PY
          cat "$W/redact_assets.out"
          echo "assets/ 脱敏门禁通过"
          git add assets/official_tools.json assets/prompt-meta.json
          if git diff --cached --quiet; then
            echo "NO_DRIFT"
            echo "STATE=NO_DRIFT" >> "$GITHUB_ENV"
            {
              echo "### refresh-assets: NO_DRIFT"
              echo
              echo "canonical 上有差异但 staging 后无差异（仅 volatile 字段变化），不开 PR。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "chore(assets): refresh from upstream CLI ${CLI_VER}"
          # 该分支只由本流水线写，且每轮整体覆盖，故用 --force。
          # （--force-with-lease 在 checkout 后本地没有该分支的 remote-tracking 引用，
          #   会以 "stale info" 被拒——2026-11-17 run 44044236258 实测。）
          git push --force origin "$BRANCH"
          gh label create asset-drift --color 0E8A16 --description "上游资产漂移（refresh-assets 自动开 PR）" --force || true

          # 固定分支 -> 已存在的开放 PR 直接改内容，不新建；没有才创建。
          EXISTING_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --body-file "$W/pr_body.md"
            PR_URL="$(gh pr view "$EXISTING_PR" --json url --jq .url)"
            echo "复用已有 PR #$EXISTING_PR"
          else
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(assets): asset drift from CLI ${CLI_VER}" \
              --body-file "$W/pr_body.md" \
              --label asset-drift)"
          fi
          echo "PR_URL=$PR_URL" >> "$GITHUB_ENV"

          # GITHUB_TOKEN 推的提交不会自动触发 pull_request 工作流（run 会停在
          # action_required），必须显式派发一次 ci，否则 PR 的闸门永远不跑。
          gh workflow run ci.yml --ref "$BRANCH" || echo "warn: 派发 ci 失败，需人工在 PR 上点运行"

          {
            echo "### refresh-assets: DRIFT"
            echo
            echo "- PR: $PR_URL"
            echo "- branch: \`$BRANCH\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "DRIFT: PR 已开：$PR_URL"

      # ---------- 把漂移 PR 送去 zen-direct-v2 实跑一轮 ----------
      # 跨仓库 dispatch 需要一个对 zen-direct-v2 有 actions:write 的令牌，
      # 这里用 secrets.ASSETS_E2E_TOKEN；没配就只警告、不阻断本流程。
      # 结果会回帖到 PR 上（本仓库用自己的 GH_TOKEN 就有写权限）。
      - name: Dispatch asset-e2e on zen-direct-v2 and report back
        if: env.PR_URL != '' && env.VERIFY_E2E == 'true'
        continue-on-error: true
        env:
          # secret 必须显式映射成 env 才能读到；只在默认分支的工作流里可用
          ASSETS_E2E_TOKEN: ${{ secrets.ASSETS_E2E_TOKEN }}
        run: |
          set -uo pipefail
          TOKEN="${ASSETS_E2E_TOKEN:-}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::没有 ASSETS_E2E_TOKEN，跳过跨仓库实跑"
            exit 0
          fi
          BRANCH="asset-drift/latest"
          echo "派发 zen-direct-v2/asset-e2e（asset_ref=$BRANCH, egress=$EGRESS）"
          if ! GH_TOKEN="$TOKEN" gh workflow run asset-e2e.yml \
              -R 2061969365/zen-direct-v2 --ref main \
              -f asset_ref="$BRANCH" -f egress="$EGRESS" -f scenario=all; then
            echo "::warning::派发失败（检查 ASSETS_E2E_TOKEN 是否有 actions:write）"
            exit 0
          fi

          # 等这个 dispatch 对应的 run 出现（最多 60s）
          RUN_ID=""
          for i in $(seq 1 20); do
            sleep 3
            RUN_ID="$(GH_TOKEN="$TOKEN" gh run list -R 2061969365/zen-direct-v2 \
              --workflow asset-e2e --limit 5 --json databaseId,createdAt,event \
              --jq '[.[] | select(.event=="workflow_dispatch")][0].databaseId' 2>/dev/null || true)"
            [ -n "$RUN_ID" ] && break
          done
          if [ -z "$RUN_ID" ]; then
            echo "::warning::没找到刚派发的 run"
            exit 0
          fi
          echo "run=$RUN_ID"

          # 等结果（最多 20 分钟）
          GH_TOKEN="$TOKEN" gh run watch "$RUN_ID" -R 2061969365/zen-direct-v2 \
            --interval 20 --exit-status >/dev/null 2>&1 || true
          CONCLUSION="$(GH_TOKEN="$TOKEN" gh run view "$RUN_ID" -R 2061969365/zen-direct-v2 \
            --json conclusion --jq '.conclusion' 2>/dev/null || echo unknown)"

          BODY="$(mktemp)"
          {
            echo "## 实跑结果：zen-direct-v2 / asset-e2e"
            echo
            echo "- 分支资产：\`$BRANCH\`"
            echo "- 出口：\`$EGRESS\`"
            echo "- 结论：**$CONCLUSION**"
            echo "- run: https://github.com/2061969365/zen-direct-v2/actions/runs/$RUN_ID"
            echo
            echo "该工作流做的事：注入本 PR 的工具定义 → \`go build\` → 起网关 → 四个 scenario 打真实免费模型 →"
            echo "判定 HTTP 200 与 \`tool_calls\`，并检查 \`/health\` 的 429/4xx/5xx 增量。"
            echo
            echo "> 合并前请确认结论为 \`success\`；失败时点上面的 run 看是哪一条 scenario。"
          } > "$BODY"

          PR_NUM="$(basename "$PR_URL" | tr -dc '0-9')"
          gh pr comment "$PR_NUM" --body-file "$BODY" || echo "::warning::回帖失败"
          echo "已回帖到 PR #$PR_NUM"

      # 契约 §8：public 仓库的 artifact 任何人可下载，所以**绝不能**上传 candidate
      # （里面有 prompt.txt 全文）。只上传不含正文的元数据。
      - name: Upload metadata artifact (不含 prompt 正文)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$W/meta"
          if [ -f "$W/extract-report.json" ]; then cp "$W/extract-report.json" "$W/meta/"; fi
          if [ -f "$W/candidate/official_tools.json" ]; then cp "$W/candidate/official_tools.json" "$W/meta/"; fi
          if [ -f "$W/candidate/prompt.txt" ]; then
            sha256sum "$W/candidate/prompt.txt" | awk '{print $1}' > "$W/meta/prompt.sha256"
          fi
          ls -la "$W/meta"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assets_metadata
          path: ${{ env.W }}/meta
          if-no-files-found: warn
          retention-days: 7

      # schema_diff.json（纯结构 diff）与 shapes/matrix.json（只有工具名/数量/sha）都是
      # 元数据，可以上传；但上传前必须再扫一遍，命中 prompt 文本或 token 形态就把该文件
      # 从 staging 目录删掉——宁可少传，也不许把正文带出公开仓库。
      - name: "Stage diff/shape metadata and scan for prompt text"
        if: always()
        run: |
          set -euo pipefail
          EXTRA="$W/meta_extra"
          rm -rf "$EXTRA"
          mkdir -p "$EXTRA"
          if [ -f "$W/schema_diff.json" ]; then cp "$W/schema_diff.json" "$EXTRA/"; fi
          if [ -f "$W/shapes/matrix.json" ]; then cp "$W/shapes/matrix.json" "$EXTRA/"; fi
          echo "staging:"
          ls -la "$EXTRA" || true
          set +e
          python3 - "$EXTRA" "$W/candidate/prompt.txt" "$GITHUB_WORKSPACE/assets/prompt.txt" \
            >"$W/meta_extra_scan.out" 2>&1 <<'PY'
          import pathlib
          import re
          import sys

          extra = pathlib.Path(sys.argv[1])
          prompt_paths = [pathlib.Path(p) for p in sys.argv[2:4]]
          prompts = []
          for path in prompt_paths:
              if path.is_file():
                  try:
                      text = path.read_text(encoding="utf-8", errors="replace")
                  except OSError:
                      continue
                  if text.strip():
                      prompts.append((path, text))

          # 与 candidate / assets 门禁同一套 token 形态（左边界 + 最小长度）
          GUARD = r"(?<![A-Za-z0-9_])"
          PATTERNS = [
              ("Bearer ", re.compile(GUARD + r"Bearer ")),
              ("ses_", re.compile(GUARD + r"ses_[A-Za-z0-9]{8,}")),
              ("ghp_", re.compile(GUARD + r"ghp_[A-Za-z0-9]{16,}")),
              ("sk-", re.compile(GUARD + r"sk-[A-Za-z0-9_-]{10,}")),
              ("[0-9a-f]{24}", re.compile(r"(?<![0-9a-fA-F])[0-9a-f]{24}(?![0-9a-fA-F])")),
          ]

          def windows(text, size=64, step=32):
              """prompt 正文的 64 字符滑窗：命中的文件一定含 prompt 正文。"""
              out = set()
              for start in range(0, max(len(text) - size, 0) + 1, step):
                  piece = text[start:start + size].strip()
                  if len(piece) >= size // 2:
                      out.add(piece)
              return out

          prompt_windows = []
          for path, text in prompts:
              prompt_windows.append((path, windows(text)))

          bad = []
          for path in sorted(extra.rglob("*")):
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for label, pattern in PATTERNS:
                  if pattern.search(text):
                      bad.append((path, "token 形态命中：" + label))
                      break
              else:
                  for origin, pieces in prompt_windows:
                      hit = next((piece for piece in pieces if piece and piece in text), None)
                      if hit is not None:
                          bad.append((path, "命中 {0} 的正文片段".format(origin)))
                          break

          if bad:
              for path, reason in bad:
                  print("HIT {0}: {1}".format(path, reason))
                  try:
                      path.unlink()
                  except OSError:
                      pass
              print("scan failed: 已删除命中文件，不上传")
              sys.exit(1)
          print("scan clean: 未发现 prompt 正文或 token 形态")
          PY
          SCAN_EXIT=$?
          set -e
          cat "$W/meta_extra_scan.out" || true
          if [ "$SCAN_EXIT" -ne 0 ]; then
            echo "::warning::diff/shape 元数据扫描命中，命中文件已删除，本次不上传对应内容"
          fi
          echo "SCAN_EXIT=$SCAN_EXIT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assets_diff_shapes
          path: ${{ env.W }}/meta_extra
          if-no-files-found: warn
          retention-days: 7

      - name: Step summary
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib

          W = pathlib.Path(os.environ["W"])
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          def env(name, default="n/a"):
              value = os.environ.get(name, "").strip()
              return value if value else default

          # 候选条数 / 被排除请求原因计数：extract_assets.py 若产出机器可读报告则读之，
          # 否则如实标 n/a（本次契约里没有 --report 参数，见回报的契约缺口）。
          report = None
          candidates = None
          reasons = None
          for path in sorted(W.glob("**/*report*.json")) + sorted(W.glob("**/*stats*.json")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if isinstance(data, dict) and ("candidates" in data or "excluded" in data or "reasons" in data):
                  report = path
                  raw = data.get("candidates")
                  if isinstance(raw, list):
                      candidates = len(raw)
                  elif isinstance(raw, int):
                      candidates = raw
                  reasons = data.get("excluded") or data.get("reasons")
                  break

          lines = [
              "### refresh-assets 汇总",
              "",
              f"- state: **{env('STATE')}**",
              f"- CLI 版本: `{env('CLI_VER')}`",
              f"- 工具数: `{env('TOOL_COUNT', 'n/a')}`",
              f"- prompt 字节数: `{env('PROMPT_BYTES', 'n/a')}`",
              f"- canonical sha256: `official_tools.json`={env('SHA_TOOLS')} / `prompt.txt`={env('SHA_PROMPT')}",
              f"- 候选条数: `{candidates if candidates is not None else 'n/a'}`",
          ]
          if isinstance(reasons, dict) and reasons:
              rendered = ", ".join(f"{k}={v}" for k, v in sorted(reasons.items()))
              lines.append(f"- 被排除请求原因计数: {rendered}")
          elif reasons:
              lines.append(f"- 被排除请求原因计数: {reasons}")
          else:
              lines.append("- 被排除请求原因计数: n/a（extract_assets.py 未产出报告文件）")
          lines.append(f"- 抓到的原始请求数: `{env('BODY_COUNT', '0')}`")
          lines.append(f"- 退出码：extract={env('EXTRACT_EXIT')} / validate={env('VALIDATE_EXIT')} / redaction={env('REDACT_EXIT')}")
          if report is not None:
              lines.append(f"- 报告文件: `{report}`")
          if os.environ.get("PR_URL"):
              lines.append(f"- PR: {os.environ['PR_URL']}")
          if os.environ.get("ISSUE_URL"):
              lines.append(f"- issue: {os.environ['ISSUE_URL']}")
          lines.append("")

          with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          if [ "${STATE:-}" = "NO_DRIFT" ]; then
            echo "NO_DRIFT"
          fi
